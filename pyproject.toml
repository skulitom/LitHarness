[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "litharness"
version = "0.1.0"
description = "Autonomous long-form fiction with auditable LLM agents, persistent narrative state, and reader-mechanism research."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "LitHarness contributors" }]
keywords = [
  "agentic-ai",
  "ai-fiction",
  "creative-writing",
  "large-language-models",
  "llm-agents",
  "llm-evaluation",
  "narrative-generation",
  "serial-fiction",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Artistic Software",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["litharness-contracts"]

[project.urls]
Homepage = "https://github.com/skulitom/LitHarness"
Repository = "https://github.com/skulitom/LitHarness"
Issues = "https://github.com/skulitom/LitHarness/issues"

[project.scripts]
litharness = "litharness.cli:main"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.130",
  "mypy>=1.15",
  "numpy>=2.2",
  "pillow>=11.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.8",
  "ruff>=0.9",
]
# Cover generation is a Codex CLI session followed by local, deterministic typography. Pillow
# belongs to that finishing step, not to the manuscript engine, so ordinary installations keep
# the runtime's one dependency and publication operators opt in explicitly.
cover = [
  "pillow>=11.0",
]
# Reading the external published-prose corpus. Deliberately its own extra rather than a dev
# dependency: `datasets` pulls pyarrow and a network stack into a repo whose only runtime
# dependency is its own contracts package, and CI must not need 12.5GB of anybody's fiction.
# `research/quality-measurement/corpus_io.py` is the shared boundary; prose is never vendored.
corpus = [
  "datasets>=3.0",
]
# The persona-reader validity program (stage-0 §70, plan/persona-reader-validity.md). Its own
# extra for the same reason `corpus` is: this pulls an API client and a network stack into a repo
# whose only runtime dependency is its own contracts package, and nothing in `src/` imports it —
# `research/quality-measurement/elicit.py` is the only consumer and it imports lazily, so the
# suite runs and the wheel builds with this uninstalled. It also spends money, which is a second
# reason not to have it installed by default.
persona = [
  "anthropic>=0.70",
]

[tool.uv.sources]
# A git rev, not a relative path: the path form needed a checkout beside this one and could
# not be pinned, so `uv.lock` recorded where contracts was and nothing about *which* of it —
# which is why CI carried a hand-maintained second checkout at a hand-written SHA. The rev
# below is the whole pin, recorded in `uv.lock`, and advancing it is bump-rev + `uv lock` in
# one commit. See CONTRIBUTING.md for co-developing against a local contracts checkout.
litharness-contracts = { git = "https://github.com/skulitom/litharness-contracts", rev = "8f264369009d7a1eaa28caa648976a48f690a949" }  # tag v0.2.0

[tool.hatch.build.targets.wheel]
packages = ["src/litharness"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "litharness/migrations"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "intensive: deterministic endurance, simulation, or repository-wide checks kept out of the quick development loop",
]
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["litharness"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "RET", "PIE", "ERA"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# Not part of `strict`, and it caught a real one: the draft handler carried a `return []`
# after its real return, under a comment asserting the opposite of what the code did. Dead
# code that contradicts its comment is how a reader learns the wrong behaviour, which is the
# defect class PLAN.md §19.1 keeps recording.
warn_unreachable = true
