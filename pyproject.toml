[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "litharness"
version = "0.1.0"
description = "An autonomous book-production system: manuscript IR, immutable revisions, and a policy-gated production loop."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "LitHarness contributors" }]
dependencies = ["litharness-contracts"]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.130",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.uv.sources]
litharness-contracts = { path = "../litharness-contracts", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/litharness"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "litharness/migrations"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["litharness"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
