[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "litharness"
version = "0.1.0"
description = "An autonomous book-production system: manuscript IR, immutable revisions, and a policy-gated production loop."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "LitHarness contributors" }]
dependencies = ["litharness-contracts"]

[project.scripts]
litharness = "litharness.cli:main"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.130",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]
# Building a craft reference profile from a published-prose corpus (§10.6). Deliberately its
# own extra rather than a dev dependency: `datasets` pulls pyarrow and a network stack into a
# repo whose only runtime dependency is its own contracts package, and CI must not need 12.5GB
# of anybody's fiction to run the suite. The *profile* is a small committed artifact; the
# corpus is never vendored, and `tools/build_craft_profile.py` is the only thing that reads it.
corpus = [
  "datasets>=3.0",
]

[tool.uv.sources]
litharness-contracts = { path = "../litharness-contracts", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/litharness"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "litharness/migrations"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["litharness"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# Not part of `strict`, and it caught a real one: the draft handler carried a `return []`
# after its real return, under a comment asserting the opposite of what the code did. Dead
# code that contradicts its comment is how a reader learns the wrong behaviour, which is the
# defect class PLAN.md §19.1 keeps recording.
warn_unreachable = true
