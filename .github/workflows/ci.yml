# `litharness-contracts` is resolved through [tool.uv.sources] as the relative path
# ../litharness-contracts, which only exists when the two checkouts sit side by side. So
# this repo is checked out into a named subdirectory rather than the workspace root, the
# contracts repo is checked out beside it, and every step runs from inside this one. Action
# SHAs are pinned rather than floated on tags, matching BookWorldState's workflow.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: LitHarness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: skulitom/litharness-contracts
          path: litharness-contracts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
        working-directory: LitHarness
      - run: uv run ruff check .
        working-directory: LitHarness
      - run: uv run mypy
        working-directory: LitHarness
      - run: uv run pytest
        working-directory: LitHarness
