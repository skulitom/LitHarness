name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older result obsolete. This is especially useful
# when several agents hand small commits to one operator-controlled checkout.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python tools/check.py smoke

  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            coverage: false
            history: 1
          - os: ubuntu-latest
            python: "3.13"
            coverage: true
            history: 0
          - os: windows-latest
            python: "3.11"
            coverage: false
            history: 1
          - os: windows-latest
            python: "3.13"
            coverage: false
            history: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the corpus audit needs every historical blob. Compatibility jobs stay shallow.
          fetch-depth: ${{ matrix.history }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Full suite
        if: matrix.coverage == false
        run: uv run python tools/check.py full
      - name: Full suite with branch coverage
        if: matrix.coverage == true
        run: uv run pytest -n auto --dist loadscope --cov=litharness
      # The public repository must never acquire excerpt-sized third-party prose. This audit
      # reads every blob any commit ever pointed at, including subsequently deleted files.
      - name: Audit corpus history
        if: matrix.coverage == true
        run: uv run python research/quality-measurement/corpus_leak_audit.py
      - name: Build wheel
        if: matrix.coverage == true
        run: uv build --wheel
